<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061226">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>TVR Dart – Turnier</title>
<style>
:root{--bg:#061226;--card:#0d1d38;--card2:#132a50;--line:#1f3a68;--tx:#eef4ff;--mut:#8ea6cf;--acc:#2f7bff;--acc2:#7db0ff;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--gold:#fbbf24;--silver:#cbd5e1;--bronze:#d08a4b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:disabled{opacity:.45;cursor:default}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));background:rgba(6,18,38,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header .t{flex:1;min-width:0}
header h1{margin:0;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header small{color:var(--mut);font-size:12px}
.undo{display:flex;align-items:center;gap:6px;padding:0 14px;height:44px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-weight:600;font-size:14px}
main{max-width:760px;margin:0 auto;padding:14px 14px 100px}
section{margin-bottom:22px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.mut{color:var(--mut)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 18px;border-radius:14px;background:var(--card2);border:1px solid var(--line);font-weight:700;width:100%}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#04210f}
.btn.bad{background:transparent;border-color:var(--bad);color:#ffb4b4}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gap{height:10px}
/* Setup */
label.f{display:block;font-size:13px;color:var(--mut);margin:0 0 6px;font-weight:600}
input[type=text],textarea,select{width:100%;background:#071630;border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none}
input:focus,textarea:focus{border-color:var(--acc)}
textarea{min-height:170px;resize:vertical;line-height:1.6}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:#071630;padding:5px;border-radius:14px;border:1px solid var(--line)}
.seg button{min-height:48px;border-radius:10px;font-weight:600;font-size:14px;color:var(--mut)}
.seg button.on{background:var(--acc);color:#fff}
.stp{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.stp:last-child{border-bottom:0}
.stp .l{font-weight:600}.stp .l small{display:block;color:var(--mut);font-weight:400;font-size:12px}
.stp .c{display:flex;align-items:center;gap:6px}
.stp .c button{width:48px;height:48px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-size:22px;font-weight:700}
.stp .c b{min-width:34px;text-align:center;font-size:20px}
.tg{width:58px;height:34px;border-radius:20px;background:#22385f;position:relative;transition:.2s}
.tg::after{content:"";position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.2s}
.tg.on{background:var(--ok)}.tg.on::after{left:28px}
.info{background:rgba(47,123,255,.12);border:1px solid rgba(47,123,255,.35);border-radius:12px;padding:12px 14px;font-size:14px}
/* Boards */
.boards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.board{text-align:left;border-radius:16px;padding:12px;min-height:112px;display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);background:var(--card)}
.board.live{background:linear-gradient(160deg,#123b80,#0d1d38);border-color:var(--acc)}
.board .bn{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--acc2);display:flex;align-items:center;gap:6px}
.board.live .bn::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.board .bm{font-weight:700;font-size:16px;line-height:1.25;flex:1}
.board .bm span{display:block;font-size:11px;color:var(--mut);font-weight:500;margin:1px 0}
.board .bs{font-size:12px;color:var(--mut)}
/* Match rows */
.mrow{width:100%;display:grid;grid-template-columns:44px 1fr;gap:4px 10px;align-items:center;text-align:left;padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin-bottom:8px}
.mrow .no{grid-row:span 2;font-weight:800;color:var(--acc2);font-size:15px;text-align:center}
.mrow .who{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}
.mrow .who b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.mrow .who b:last-child{text-align:right}
.mrow .who i{font-style:normal;color:var(--mut);font-size:13px;flex:none}
.mrow .who i.sc{color:var(--tx);font-weight:800;font-size:16px;background:var(--card2);padding:2px 10px;border-radius:8px}
.mrow .tag{font-size:12px;color:var(--mut)}
.mrow .tag .busy{color:var(--warn)}
.mrow.live{border-color:var(--acc)}
.win{color:var(--ok)!important}
details summary{cursor:pointer;list-style:none;padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:600;margin-bottom:8px}
details summary::-webkit-details-marker{display:none}
/* Tables */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:11px;color:var(--mut);font-weight:600;text-align:center;padding:6px 3px;text-transform:uppercase}
.tbl td{padding:9px 3px;text-align:center;border-top:1px solid var(--line)}
.tbl td.n,.tbl th.n{text-align:left}
.tbl td.n{font-weight:600;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl tr.q td:first-child{box-shadow:inset 3px 0 0 var(--ok)}
.tbl td.p{font-weight:800}
.prog{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--acc)}
/* Bracket */
.brk{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x proximity}
.col{display:flex;flex-direction:column;min-width:200px;scroll-snap-align:start}
.col h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--acc2);margin:0 0 8px;text-align:center}
.col .cm{display:flex;flex-direction:column;justify-content:space-around;flex:1;gap:10px}
.bm2{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.bm2.live{border-color:var(--acc)}
.bm2 .r{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;font-size:14px}
.bm2 .r+.r{border-top:1px solid var(--line)}
.bm2 .r span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bm2 .r b{min-width:18px;text-align:right}
.bm2 .h{font-size:10px;color:var(--mut);padding:4px 10px 0}
.ph{color:var(--mut);font-style:italic}
/* Podium */
.pod{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:8px;text-align:center;margin-top:10px}
.pod div{border-radius:14px 14px 4px 4px;padding:12px 6px;font-weight:700}
.pod .p1{background:linear-gradient(180deg,#7a5a00,#3b2c00);min-height:150px;border:1px solid var(--gold)}
.pod .p2{background:linear-gradient(180deg,#3d4757,#1f2733);min-height:115px;border:1px solid var(--silver)}
.pod .p3{background:linear-gradient(180deg,#5a3517,#2b1a0b);min-height:95px;border:1px solid var(--bronze)}
.pod .pl{font-size:30px;display:block}
/* Nav */
nav{position:fixed;bottom:0;left:0;right:0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(6,18,38,.97);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--mut)}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--acc2)}
/* Modal */
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:94vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:22px}}
.sheet h3{margin:0 0 2px;font-size:18px}
.pl{margin-top:14px}
.pl .nmr{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:18px;margin-bottom:8px}
.pl .nmr .big{font-size:34px;font-weight:800;color:var(--acc2)}
.legs{display:flex;flex-wrap:wrap;gap:6px}
.legs button{flex:1 0 50px;height:58px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-size:22px;font-weight:800}
.legs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.legs button.on.w{background:var(--ok);border-color:var(--ok);color:#04210f}
.xs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.xs>div{background:#071630;border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:13px;color:var(--mut)}
.xs button{width:38px;height:38px;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-weight:800;font-size:18px;color:var(--tx)}
.xs b{color:var(--tx);font-size:17px;min-width:20px;text-align:center}
.xs input{width:70px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;color:var(--tx)}
.acts{display:grid;gap:8px;margin-top:16px}
.bchips{display:flex;flex-wrap:wrap;gap:8px}
.bchips button{flex:1 0 30%;min-height:48px;border-radius:12px;background:var(--card2);border:1px solid var(--acc);font-weight:700;font-size:14px}
#toast{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-20px);opacity:0;transition:.25s;z-index:60;background:#fff;color:#061226;padding:12px 18px;border-radius:12px;font-weight:600;max-width:90vw;text-align:center;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
/* TV */
#tv{position:fixed;inset:0;z-index:80;background:var(--bg);padding:2.2vw;display:none;overflow:hidden}
#tv.on{display:block}
#tv .th{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.6vw}
#tv .th h1{margin:0;font-size:2.6vw}
#tv .th .clk{font-size:2.4vw;font-weight:800;color:var(--acc2);margin-right:56px}
#tv .tg2{display:grid;grid-template-columns:1fr 1.25fr;gap:2vw;height:calc(100% - 5vw)}
#tv h2{font-size:1.3vw}
#tv .tb{display:grid;grid-template-columns:1fr 1fr;gap:1vw}
#tv .tb .board{min-height:9vw;padding:1vw}
#tv .tb .bn{font-size:1vw}#tv .tb .bm{font-size:1.6vw}#tv .tb .bs{font-size:.9vw}#tv .tb .bm span{font-size:.9vw}
#tv .nx{font-size:1.25vw}
#tv .nx div{display:flex;gap:1vw;padding:.6vw 0;border-bottom:1px solid var(--line)}
#tv .nx div b{color:var(--acc2);min-width:3.5vw}
#tv .tbl{font-size:1.25vw}#tv .tbl th{font-size:.85vw}#tv .tbl td.n{max-width:none}
#tv .brk{overflow:hidden}#tv .col{min-width:0;flex:1}#tv .bm2 .r{font-size:1.05vw;padding:.5vw .7vw}
#tv .x{position:absolute;top:1vw;right:1vw;width:48px;height:48px;border-radius:50%;background:var(--card2);font-size:22px;opacity:.4}
#tv .tgrid{display:grid;grid-template-columns:1fr 1fr;gap:1.4vw}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="tv"></div>
<div id="toast"></div>
<script>
'use strict';
const KEY='tvr-turnier-v1', UKEY='tvr-turnier-undo-v1', GL='ABCDEFGHIJKLMNOP';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function fresh(names){return{v:1,phase:'setup',name:'Vereinsmeisterschaft',names:names||'',seq:0,
 cfg:{mode:'gko',game:'501 Double Out',gFT:3,kFT:3,fFT:3,groups:3,adv:2,boards:4,third:true,rueck:false,auto:true},
 players:{},groups:[],matches:[],boards:[]}}
let S, U=[], ui={tab:'spiele',m:null,tv:false,tvi:0};
try{S=JSON.parse(lsGet(KEY))}catch(e){}
if(!S||!S.cfg)S=fresh();
try{U=JSON.parse(lsGet(UKEY)||'[]')}catch(e){U=[]}
function save(){lsSet(KEY,JSON.stringify(S));lsSet(UKEY,JSON.stringify(U))}
function commit(fn){U.push(JSON.stringify(S));if(U.length>30)U.shift();fn();save();render()}
function undo(){if(!U.length)return toast('Nichts zum Rückgängigmachen');S=JSON.parse(U.pop());ui.m=null;save();render();toast('Letzte Aktion rückgängig gemacht')}
let tt;function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2600)}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const byId=id=>S.matches.find(m=>m.id===id);
const pn=id=>S.players[id]?S.players[id].name:'—';
function slotName(m,k){const id=m['p'+k];if(id)return pn(id);
 const s=S.matches.find(x=>x.next&&x.next[0]===m.id&&x.next[1]===k);if(s)return 'Sieger #'+s.no;
 const l=S.matches.find(x=>x.lose&&x.lose[0]===m.id&&x.lose[1]===k);if(l)return 'Verlierer #'+l.no;return 'Freilos'}
function lab(m){return m.stage==='G'?(S.groups[m.g]?S.groups[m.g].name:'')+' · Runde '+(m.r+1):m.label}
function mk(o){S.seq=(S.seq||0)+1;return Object.assign({id:'m'+S.seq,no:S.seq,l1:null,l2:null,st:'open',board:null,w:null,x:{t1:0,t2:0,h1:0,h2:0}},o)}

/* ---------- Turnierlogik ---------- */
function rrRounds(ids){const a=[...ids];if(a.length%2)a.push(null);const n=a.length,out=[];
 for(let r=0;r<n-1;r++){const pr=[];for(let i=0;i<n/2;i++){const x=a[i],y=a[n-1-i];if(x&&y)pr.push(r%2?[y,x]:[x,y])}out.push(pr);a.splice(1,0,a.pop())}return out}
function buildGroups(){const tmp=[];S.groups.forEach((g,gi)=>{let rs=rrRounds(g.players);if(S.cfg.rueck)rs=rs.concat(rs.map(r=>r.map(([a,b])=>[b,a])));
 rs.forEach((pr,ri)=>pr.forEach(([a,b])=>tmp.push({g:gi,r:ri,p1:a,p2:b})))});
 tmp.sort((x,y)=>x.r-y.r||x.g-y.g);tmp.forEach(t=>S.matches.push(mk(Object.assign({stage:'G',ft:S.cfg.gFT},t))))}
function bracketOrder(size){let o=[1];while(o.length<size){const m=o.length*2+1;o=o.flatMap(s=>[s,m-s])}return o}
function roundName(r,R){const d=R-r;return d===1?'Finale':d===2?'Halbfinale':d===3?'Viertelfinale':d===4?'Achtelfinale':'Runde '+(r+1)}
function avoidClash(P){if(!S.groups.length||S.groups.length<2)return P;const gOf={};S.groups.forEach((g,gi)=>g.players.forEach(p=>gOf[p]=gi));
 const n=P.length/2,bad=i=>P[2*i]&&P[2*i+1]&&gOf[P[2*i]]===gOf[P[2*i+1]];
 for(let i=0;i<n;i++){if(!bad(i))continue;for(let j=n-1;j>=0;j--){if(j===i||!P[2*j+1])continue;const a=P[2*i+1],b=P[2*j+1];P[2*i+1]=b;P[2*j+1]=a;if(!bad(i)&&!bad(j))break;P[2*i+1]=a;P[2*j+1]=b}}return P}
function put(link,pid){if(!link)return;const m=byId(link[0]);if(m)m['p'+link[1]]=pid}
function buildKO(seeds){const n=seeds.length;let size=1;while(size<n)size*=2;const R=Math.max(1,Math.log2(size));
 const pos=avoidClash(bracketOrder(size).map(s=>s<=n?seeds[s-1]:null));
 const BR=[];for(let r=0;r<R;r++){BR[r]=[];for(let i=0;i<(size>>(r+1));i++)BR[r].push({stage:'K',r,i,R,ft:r===R-1?S.cfg.fFT:S.cfg.kFT,p1:null,p2:null,label:roundName(r,R)})}
 const third=(S.cfg.third&&n>=4&&R>=2)?{stage:'K',r:R-1,i:1,R,ft:S.cfg.kFT,p1:null,p2:null,label:'Spiel um Platz 3',third:true}:null;
 const list=[];for(let r=0;r<R-1;r++)list.push(...BR[r]);if(third)list.push(third);list.push(BR[R-1][0]);
 const made=new Map();list.forEach(o=>{const m=mk(o);made.set(o,m);S.matches.push(m)});
 for(let r=0;r<R-1;r++)BR[r].forEach((o,i)=>{const m=made.get(o);m.next=[made.get(BR[r+1][i>>1]).id,i%2?2:1];if(r===R-2&&third)m.lose=[made.get(third).id,i%2?2:1]});
 BR[0].forEach((o,i)=>{const m=made.get(o);m.p1=pos[2*i];m.p2=pos[2*i+1];if(!m.p1||!m.p2){m.st='bye';m.w=m.p1||m.p2;put(m.next,m.w)}});
 S.koR=R}
function table(gi){const g=S.groups[gi];const T={};g.players.forEach(id=>T[id]={id,sp:0,s:0,n:0,lf:0,la:0,pt:0,t:0,h:0});
 S.matches.forEach(m=>{if(m.stage!=='G'||m.g!==gi||m.st!=='done')return;const a=T[m.p1],b=T[m.p2];a.sp++;b.sp++;a.lf+=m.l1;a.la+=m.l2;b.lf+=m.l2;b.la+=m.l1;
  if(m.l1>m.l2){a.s++;b.n++;a.pt+=2}else{b.s++;a.n++;b.pt+=2}a.t+=m.x.t1;b.t+=m.x.t2;a.h=Math.max(a.h,m.x.h1);b.h=Math.max(b.h,m.x.h2)});
 const h2h=(x,y)=>{const m=S.matches.find(m=>m.stage==='G'&&m.st==='done'&&((m.p1===x&&m.p2===y)||(m.p1===y&&m.p2===x)));return m?(m.w===x?-1:1):0};
 return Object.values(T).sort((a,b)=>b.pt-a.pt||(b.lf-b.la)-(a.lf-a.la)||b.lf-a.lf||h2h(a.id,b.id)||pn(a.id).localeCompare(pn(b.id)))}
const cmpRows=(a,b)=>b.pt/(b.sp||1)-a.pt/(a.sp||1)||((b.lf-b.la)/(b.sp||1))-((a.lf-a.la)/(a.sp||1))||b.lf-a.lf;
const gDone=()=>S.matches.filter(m=>m.stage==='G').every(m=>m.st==='done');
function finalM(){return S.matches.find(m=>m.stage==='K'&&m.label==='Finale')}
function busy(){const b=new Set();S.matches.forEach(m=>{if(m.st==='live'){b.add(m.p1);b.add(m.p2)}});return b}
function curStage(){return S.phase==='groups'?'G':'K'}
function nextPlayable(){const b=busy(),st=curStage();return S.matches.filter(m=>m.stage===st&&m.st==='open'&&m.p1&&m.p2&&!b.has(m.p1)&&!b.has(m.p2)).sort((a,c)=>a.no-c.no)[0]}
function callTo(m,b){m.st='live';m.board=b;S.boards[b]=m.id}
function freeBoard(m){if(m.board!=null&&S.boards[m.board]===m.id)S.boards[m.board]=null;m.board=null}
function fillBoards(){if(S.phase==='setup'||S.phase==='done')return;S.boards.forEach((x,b)=>{if(!x){const m=nextPlayable();if(m)callTo(m,b)}})}
function checkPhase(){const c=S.cfg;
 if(c.mode==='liga'){S.phase=gDone()?'done':'groups';return}
 if(S.phase==='ko'||S.phase==='done'){const f=finalM();S.phase=f&&f.st==='done'?'done':'ko'}}
function editBlock(m){if(m.stage==='G'&&S.cfg.mode==='gko'&&S.phase!=='groups')return 'Die K.O.-Runde läuft bereits – Gruppenergebnisse sind gesperrt.';
 for(const l of [m.next,m.lose]){if(!l)continue;const n=byId(l[0]);if(n&&(n.st==='done'||n.st==='live'))return 'Folgespiel #'+n.no+' läuft schon oder ist gespielt. Bitte zuerst dort zurücksetzen.'}return ''}
function places(){const c=S.cfg;if(c.mode==='liga'){const t=table(0);return [t[0],t[1],t[2]].map(r=>r?[r.id]:[])}
 const f=finalM();if(!f||f.st!=='done')return null;const lo=f.w===f.p1?f.p2:f.p1;const th=S.matches.find(m=>m.third);
 let p3=[];if(th&&th.st==='done')p3=[th.w];else{p3=S.matches.filter(m=>m.stage==='K'&&m.r===f.r-1&&m.st==='done'&&!m.third).map(m=>m.w===m.p1?m.p2:m.p1)}
 return [[f.w],[lo],p3]}

function startTournament(){const names=[...new Set(S.names.split('\n').map(s=>s.trim()).filter(Boolean))],c=S.cfg;
 if(names.length<2)return toast('Bitte mindestens 2 Spieler eintragen');
 if(c.mode==='gko'){if(names.length<c.groups*2)return toast(`Für ${c.groups} Gruppen braucht ihr mindestens ${c.groups*2} Spieler`);
  const mn=Math.floor(names.length/c.groups);if(c.adv>=mn)return toast(`Bei ${c.groups} Gruppen können höchstens ${mn-1} pro Gruppe weiterkommen`);
  if(c.adv*c.groups<2)return toast('Mindestens 2 Spieler müssen in die K.O.-Runde')}
 commit(()=>{S.players={};const ids=names.map((n,i)=>{const id='p'+(i+1);S.players[id]={id,name:n};return id});
  const sh=shuffle(ids);S.matches=[];S.groups=[];S.seq=0;S.boards=Array(c.boards).fill(null);S.started=Date.now();
  if(c.mode==='ko'){buildKO(sh);S.phase='ko';checkPhase()}
  else{const gn=c.mode==='liga'?1:c.groups;for(let g=0;g<gn;g++)S.groups.push({name:c.mode==='liga'?'Tabelle':'Gruppe '+GL[g],players:[]});
   sh.forEach((id,i)=>S.groups[i%gn].players.push(id));buildGroups();S.phase='groups'}
  if(c.auto)fillBoards();ui.tab=c.mode==='ko'?'ko':'tab'});
 toast('Ausgelost – viel Erfolg!')}
function startKO(){commit(()=>{const q=[];for(let pos=0;pos<S.cfg.adv;pos++){const tier=S.groups.map((g,gi)=>table(gi)[pos]).filter(Boolean);tier.sort(cmpRows);q.push(...tier.map(r=>r.id))}
 S.boards.forEach((x,b)=>{if(x){const m=byId(x);if(m){m.st='open';m.board=null}S.boards[b]=null}});
 buildKO(q);S.phase='ko';checkPhase();if(S.cfg.auto)fillBoards();ui.tab='ko'});toast('K.O.-Runde ausgelost')}
function saveResult(){const d=ui.m,m=byId(d.id),blk=m.st==='done'?editBlock(m):'';if(blk)return toast(blk);
 commit(()=>{m.l1=d.l1;m.l2=d.l2;m.x={t1:d.t1|0,t2:d.t2|0,h1:+d.h1||0,h2:+d.h2||0};m.w=d.l1>d.l2?m.p1:m.p2;const lo=m.w===m.p1?m.p2:m.p1;
  m.st='done';put(m.next,m.w);put(m.lose,lo);freeBoard(m);checkPhase();if(S.cfg.auto)fillBoards();ui.m=null});
 toast(pn(m.w)+' gewinnt '+Math.max(d.l1,d.l2)+':'+Math.min(d.l1,d.l2))}
function resetMatch(m){const blk=editBlock(m);if(blk)return toast(blk);
 commit(()=>{m.l1=m.l2=null;m.w=null;m.x={t1:0,t2:0,h1:0,h2:0};m.st='open';freeBoard(m);put(m.next,null);put(m.lose,null);checkPhase();ui.m=null})}
function ask(text,yes,fn){ui.m={type:'ask',text,yes,fn};renderModal()}

 a.href=URL.createObjectURL(b);a.download=(S.name||'turnier').replace(/[^\wäöüÄÖÜß-]+/g,'_')+'.json';document.body.appendChild(a);a.click();a.remove();toast('Backup gespeichert')}

function nameCount(){return [...new Set(S.names.split('\n').map(s=>s.trim()).filter(Boolean))].length}
function setupInfo(){const n=nameCount(),c=S.cfg;if(n<2)return 'Tragt mindestens 2 Spieler ein (einen Namen pro Zeile).';
 if(c.mode==='ko'){let s=1;while(s<n)s*=2;const R=Math.log2(s);return `${n} Spieler im K.O.-System → ${R} Runde${R>1?'n':''}${s>n?`, ${s-n} Freilos${s-n>1?'e':''}`:''}. Spiele: ${n-1}${c.third&&n>=4?' + Spiel um Platz 3':''}.`}
 if(c.mode==='liga'){const g=n*(n-1)/2*(c.rueck?2:1);return `${n} Spieler, jeder gegen jeden${c.rueck?' (Hin & Rück)':''} → ${g} Spiele.`}
 const mn=Math.floor(n/c.groups),mx=Math.ceil(n/c.groups);if(n<c.groups*2)return `Zu wenige Spieler für ${c.groups} Gruppen.`;
 const ko=c.groups*c.adv;let s=1;while(s<ko)s*=2;let gm=0;for(let g=0;g<c.groups;g++){const k=Math.floor(n/c.groups)+(g<n%c.groups?1:0);gm+=k*(k-1)/2}
 return `${c.groups} Gruppe${c.groups>1?'n':''} à ${mn===mx?mn:mn+'–'+mx} Spieler → ${gm*(c.rueck?2:1)} Gruppenspiele. ${ko} Spieler im K.O. (${roundName(0,Math.log2(s))}${s>ko?`, ${s-ko} Freilos${s-ko>1?'e':''} für die Besten`:''}).${c.adv>=mn?' ⚠️ Zu viele Weiterkommende!':''}`}

 const tag=m.st==='live'?`<span style="color:var(--ok)">● Scheibe ${m.board+1}</span> · `:'';
 const bz=(m.st==='open'&&ready&&(b.has(m.p1)||b.has(m.p2)))?' · <span class="busy">Spieler noch am Board</span>':'';
 return `<button class="mrow ${m.st}" data-act="open" data-id="${m.id}" ${ready?'':'disabled'}><span class="no">#${m.no}</span>
 <span class="who"><b class="${done&&m.w===m.p1?'win':''}">${esc(slotName(m,1))}</b>${done?`<i class="sc">${m.l1} : ${m.l2}</i>`:'<i>vs</i>'}<b class="${done&&m.w===m.p2?'win':''}">${esc(slotName(m,2))}</b></span>
 <span class="tag">${tag}${esc(lab(m))} · First to ${m.ft}${bz}</span></button>`}
function boardsHTML(){return `<div class="boards">`+S.boards.map((mid,b)=>{const m=mid&&byId(mid);
 return m?`<button class="board live" data-act="open" data-id="${m.id}"><div class="bn">Scheibe ${b+1}</div><div class="bm">${esc(pn(m.p1))}<span>gegen</span>${esc(pn(m.p2))}</div><div class="bs">#${m.no} · ${esc(lab(m))} · FT${m.ft}</div></button>`
 :`<button class="board" data-act="call" data-b="${b}" ${S.phase==='done'?'disabled':''}><div class="bn">Scheibe ${b+1}</div><div class="bm mut">frei</div><div class="bs">${S.phase==='done'?'':'Tippen = nächstes Spiel'}</div></button>`}).join('')+'</div>'}
function podium(){const p=places();if(!p)return '';const n=a=>a.map(id=>esc(pn(id))).join('<br>')||'–';
 return `<div class="card" style="text-align:center"><h2 style="justify-content:center">🏆 Endergebnis</h2><div style="font-size:24px;font-weight:800">${esc(pn(p[0][0]))}</div><div class="mut">ist Turniersieger!</div>
 <div class="pod"><div class="p2"><span class="pl">🥈</span>${n(p[1])}</div><div class="p1"><span class="pl">🥇</span>${n(p[0])}</div><div class="p3"><span class="pl">🥉</span>${n(p[2])}</div></div></div>`}

 let h=`<div class="card"><div style="display:flex;justify-content:space-between;font-weight:700"><span>${PH[S.phase]}</span><span>${d} / ${all.length} Spiele</span></div><div class="prog"><i style="width:${all.length?d/all.length*100:0}%"></i></div></div>`;
 if(S.phase==='groups'&&S.cfg.mode==='gko'&&gDone())h=`<div class="card" style="border-color:var(--ok)"><b>✅ Gruppenphase abgeschlossen</b><p class="mut" style="margin:6px 0 12px">Prüft die Tabellen. Danach werden die ${S.cfg.adv*S.groups.length} Qualifizierten gesetzt (Gruppensieger zuerst, Spieler aus derselben Gruppe treffen sich möglichst nicht in Runde 1).</p><button class="btn ok" data-act="startko">K.O.-Runde starten →</button></div>`;

 ${pl(1)}${pl(2)}<p class="mut" style="font-size:12px;margin:10px 0 0">Tipp: Nur die Legs des Verlierers antippen – der Sieger bekommt automatisch ${ft}.</p>
 <div class="acts"><button class="btn ok" data-act="saveres" ${valid?'':'disabled'}>✔ Ergebnis speichern</button>${acts}</div></div></div>`}
function askModal(){const d=ui.m;return `<div class="ov" data-act="close"><div class="sheet" data-stop><h3>${esc(d.text)}</h3><div class="acts row2" style="margin-top:18px"><button class="btn" data-act="close">Abbrechen</button><button class="btn bad" data-act="askyes">${esc(d.yes)}</button></div></div></div>`}
function renderModal(){$('#modal').innerHTML=!ui.m?'':ui.m.type==='res'?resModal():askModal()}

/* ---------- TV ---------- */
function renderTV(){const el=$('#tv');if(!ui.tv){el.classList.remove('on');return}el.classList.add('on');
 const slides=[];S.groups.forEach((g,gi)=>slides.push(['g',gi]));if(S.matches.some(m=>m.stage==='K'))slides.push(['k']);
 const open=S.matches.filter(m=>m.stage===curStage()&&m.st==='open'&&m.p1&&m.p2).sort((a,b)=>a.no-b.no).slice(0,6);
 let right='';
 if(S.phase==='done')right=podium();
 else if(slides.length){const s=slides[ui.tvi%slides.length];
  if(s[0]==='k')right=`<h2>Turnierbaum</h2>${bracketHTML()}`;
  else if(S.groups.length>2&&S.groups.length<=4&&s[1]===0){right=`<h2>Gruppen</h2><div class="tgrid">${S.groups.map((g,gi)=>`<div class="card"><b>${esc(g.name)}</b>${tableHTML(gi)}</div>`).join('')}</div>`}
  else right=`<h2>${esc(S.groups[s[1]].name)}</h2><div class="card">${tableHTML(s[1])}</div>`}
 const now=new Date();
 el.innerHTML=`<button class="x" data-act="tvoff">✕</button><div class="th"><h1>🎯 ${esc(S.name)}</h1><div class="mut" style="font-size:1.3vw">${PH[S.phase]}</div><div class="clk">${now.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}</div></div>
 <div class="tg2"><div><h2>Auf den Scheiben</h2><div class="tb">${S.boards.map((mid,b)=>{const m=mid&&byId(mid);return m?`<div class="board live"><div class="bn">Scheibe ${b+1}</div><div class="bm">${esc(pn(m.p1))}<span>gegen</span>${esc(pn(m.p2))}</div><div class="bs">${esc(lab(m))} · First to ${m.ft}</div></div>`:`<div class="board"><div class="bn">Scheibe ${b+1}</div><div class="bm mut">frei</div></div>`}).join('')}</div>
 ${open.length?`<h2 style="margin-top:1.6vw">Als Nächstes</h2><div class="nx">${open.map(m=>`<div><b>#${m.no}</b><span>${esc(pn(m.p1))} – ${esc(pn(m.p2))}</span><span class="mut" style="margin-left:auto">${esc(lab(m))}</span></div>`).join('')}</div>`:''}</div>
 <div>${right}</div></div>`}
setInterval(()=>{if(ui.tv){ui.tvi++;renderTV()}},12000);

function render(){const app=$('#app');app.innerHTML=hdr()+(S.phase==='setup'?setupView():'<main>'+view()+'</main>'+nav());renderModal();renderTV()}

/* ---------- Events ---------- */
const A={
 undo:()=>undo(),
 tab:d=>{ui.tab=d.t;render();scrollTo(0,0)},
 mode:d=>{S.cfg.mode=d.v;save();render()},
 cfg:d=>{const k=d.k,v=Math.min(+d.max,Math.max(+d.min,S.cfg[k]+(+d.d)));if(k==='boards'&&S.phase!=='setup'){
   commit(()=>{S.cfg.boards=v;while(S.boards.length<v)S.boards.push(null);while(S.boards.length>v){const x=S.boards.pop();if(x){const m=byId(x);m.st='open';m.board=null}}if(S.cfg.auto)fillBoards()});return}
  S.cfg[k]=v;save();render()},
 tgl:d=>{if(S.phase!=='setup'&&d.k==='auto'){commit(()=>{S.cfg.auto=!S.cfg.auto;if(S.cfg.auto)fillBoards()});return}S.cfg[d.k]=!S.cfg[d.k];save();render()},
 start:()=>startTournament(),
 startko:()=>ask('K.O.-Runde jetzt auslosen? Gruppenergebnisse können danach nicht mehr geändert werden.','Starten',startKO),
 call:d=>{const m=nextPlayable();if(!m)return toast('Gerade kein Spiel bereit (Spieler noch am Board oder alles gespielt)');commit(()=>callTo(m,+d.b))},
 open:d=>{const m=byId(d.id);if(!m||!m.p1||!m.p2)return;ui.m={type:'res',id:m.id,l1:m.l1,l2:m.l2,t1:m.x.t1,t2:m.x.t2,h1:m.x.h1||'',h2:m.x.h2||''};renderModal()},
 close:()=>{ui.m=null;renderModal()},
 leg:d=>{const k=+d.k,v=+d.v,o=k===1?2:1,m=byId(ui.m.id);ui.m['l'+k]=v;if(v<m.ft&&(ui.m['l'+o]==null||ui.m['l'+o]<m.ft))ui.m['l'+o]=m.ft;else if(v===m.ft&&ui.m['l'+o]===m.ft)ui.m['l'+o]=null;renderModal()},
 x:d=>{ui.m[d.f]=Math.max(0,(ui.m[d.f]||0)+(+d.d));renderModal()},
 saveres:()=>saveResult(),
 callm:d=>{const m=byId(ui.m.id);const b=busy();if(b.has(m.p1)||b.has(m.p2))return toast('Ein Spieler steht gerade noch an einer anderen Scheibe');commit(()=>{callTo(m,+d.b);ui.m=null})},
 uncall:()=>{const m=byId(ui.m.id);commit(()=>{freeBoard(m);m.st='open';ui.m=null})},
 reset:()=>{const m=byId(ui.m.id);ask('Ergebnis von Spiel #'+m.no+' löschen?','Löschen',()=>resetMatch(m))},
 askyes:()=>{const f=ui.m.fn;ui.m=null;renderModal();f()},
 tv:()=>{ui.tv=true;renderTV();try{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()}catch(e){}},
 tvoff:()=>{ui.tv=false;renderTV();try{document.fullscreenElement&&document.exitFullscreen()}catch(e){}},
 export:()=>exportJSON(),
 copy:()=>{try{navigator.clipboard.writeText(JSON.stringify(S)).then(()=>toast('Backup kopiert'),()=>toast('Kopieren nicht erlaubt'))}catch(e){toast('Kopieren nicht erlaubt')}},
 import:()=>$('#imp').click(),
 new:()=>ask('Aktuelles Turnier beenden und neues anlegen? (Spielernamen bleiben erhalten)','Neues Turnier',()=>commit(()=>{const keep=S.names,c=S.cfg;S=fresh(keep);S.cfg=Object.assign(S.cfg,c);ui.tab='spiele'}))
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;
 if(t.dataset.act==='close'&&e.target.closest('[data-stop]')&&!e.target.closest('button[data-act="close"]'))return;
 if(t.disabled)return;A[t.dataset.act]&&A[t.dataset.act](t.dataset,t)});
document.addEventListener('input',e=>{const t=e.target;
 if(t.dataset.bind){if(t.dataset.bind==='game')S.cfg.game=t.value;else S[t.dataset.bind]=t.value;save();
  const c=$('#ncount');if(c)c.textContent=nameCount()+' Spieler';const i=$('#sinfo');if(i)i.innerHTML=setupInfo();const h=$('header h1');if(h&&t.dataset.bind==='name')h.textContent='🎯 '+(S.name||'Turnier')}
 if(t.dataset.hf&&ui.m){ui.m[t.dataset.hf]=Math.min(170,Math.max(0,+t.value||0))}});
document.addEventListener('change',e=>{if(e.target.id!=='imp')return;const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.cfg||!d.matches)throw 0;commit(()=>{S=d});toast('Backup geladen')}catch(x){toast('Datei ist kein gültiges Turnier-Backup')}};r.readAsText(f)});
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{S=JSON.parse(e.newValue);render()}catch(x){}}});
setInterval(()=>{if(ui.tv)renderTV()},30000);
render();
</script>
</body>
</html>
